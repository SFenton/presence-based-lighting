resume_automation:
  name: Resume Automation
  description: Resume automation for controlled entities by resetting the automation_paused flag.
  target:
    entity:
      integration: presence_based_lighting
      domain: switch
  fields:
    entity_id:
      name: Entity
      description: The controlled entity to resume automation for. If not specified, resumes all entities for the targeted switch.
      required: false
      selector:
        entity:
          domain:
            - light
            - switch
            - fan
            - cover

pause_automation:
  name: Pause Automation
  description: Pause automation for controlled entities by setting the automation_paused flag.
  target:
    entity:
      integration: presence_based_lighting
      domain: switch
  fields:
    entity_id:
      name: Entity
      description: The controlled entity to pause automation for. If not specified, pauses all entities for the targeted switch.
      required: false
      selector:
        entity:
          domain:
            - light
            - switch
            - fan
            - cover

set_automation_state:
  name: Set Automation State
  description: >
    Set the targeted Presence Based Lighting control to On, Off, Paused,
    Quieted, or Active.
  target:
    entity:
      integration: presence_based_lighting
      domain: switch
  fields:
    state:
      name: State
      description: Administrative state to apply.
      required: true
      selector:
        select:
          options:
            - label: "On"
              value: "on"
            - label: "Off"
              value: "off"
            - label: Paused
              value: paused
            - label: Quieted
              value: quieted
            - label: Active
              value: active
          mode: dropdown
    entity_id:
      name: Entity
      description: The controlled entity to update. If omitted, updates all entities for the targeted switch.
      required: false
      selector:
        entity:
          domain:
            - light
            - switch
            - fan
            - cover

resume_all_automation:
  name: Resume All Automation
  description: >
    Clear every pause and every quieted (rearm-after-clear) hold across all
    Presence Based Lighting config entries, then reconcile each controlled
    entity. Escape hatch for when many rooms are suppressed at once.

manual_control:
  name: Manual Control
  description: >
    Apply an explicitly attributed turn-on or turn-off to exactly one opted-in
    Presence Based Lighting controlled root. Intended for wall-switch
    automations; the integration binds the command context before dispatch.
  fields:
    config_entry_id:
      name: Config Entry ID
      description: Exact Presence Based Lighting config entry that owns the root.
      required: true
      selector:
        text: {}
    entity_id:
      name: Controlled Root
      description: Exactly one configured controlled root entity.
      required: true
      selector:
        entity: {}
    action:
      name: Action
      description: The light action to dispatch.
      required: true
      selector:
        select:
          options:
            - turn_on
            - turn_off
    light_data:
      name: Light Data
      description: Bounded light service data for the turn-on or turn-off.
      required: false
      selector:
        object: {}

acquire_control:
  name: Acquire Control Lease
  description: >
    Acquire or atomically update a bounded external control lease. Disabled by
    default per controlled entity. Returns the absolute expiry and stable
    blocker/outcome codes.
  target:
    entity:
      integration: presence_based_lighting
      domain: switch
  fields:
    controlled_entity_id:
      name: Controlled Entity
      description: Exact controlled root when the targeted PBL switch covers more than one entity.
      required: false
      selector:
        entity: {}
    lease_id:
      name: Lease ID
      description: Stable opaque caller token used for compare-and-set release.
      required: true
      selector:
        text: {}
    controller_id:
      name: Controller ID
      description: Stable ID for the sole room-level command coordinator.
      required: true
      selector:
        text: {}
    request_id:
      name: Request ID
      description: Idempotency ID for this acquire/update request.
      required: true
      selector:
        text: {}
    owner:
      name: Owner
      description: Registered external control owner.
      required: true
      selector:
        select:
          options:
            - wake_light
    occurrence_ids:
      name: Occurrence IDs
      description: Bounded active wake occurrence IDs represented by this room lease.
      required: true
      selector:
        object: {}
    ttl_seconds:
      name: Lease TTL
      description: Initial lease duration. Duplicate acquire never silently extends the original expiry.
      required: true
      selector:
        number:
          min: 1
          max: 7200
          mode: box
    target_entity_ids:
      name: Intended Light Targets
      description: Explicit leaf targets validated against current root membership.
      required: true
      selector:
        entity:
          domain: light
          multiple: true

dispatch_control:
  name: Dispatch Control Lease Command
  description: >
    Dispatch one wake-owned light.turn_on through exact lease, generation,
    membership, target, brightness, and pre-dispatch context enforcement.
  target:
    entity:
      integration: presence_based_lighting
      domain: switch
  fields:
    controlled_entity_id:
      name: Controlled Entity
      description: Exact PBL-controlled root for this lease.
      required: true
      selector:
        entity:
          domain: light
    lease_id:
      name: Lease ID
      required: true
      selector:
        text: {}
    controller_id:
      name: Controller ID
      required: true
      selector:
        text: {}
    expected_generation:
      name: Expected Generation
      description: Latest compare-and-set generation returned by acquire_control.
      required: true
      selector:
        number:
          min: 1
          mode: box
    command_id:
      name: Command ID
      description: Stable opaque request/step correlation ID.
      required: true
      selector:
        text: {}
    owner:
      name: Owner
      required: true
      selector:
        select:
          options:
            - wake_light
    target_entity_ids:
      name: Intended Light Targets
      description: Explicit leaf targets; removed or unauthorized leaves are filtered.
      required: true
      selector:
        entity:
          domain: light
          multiple: true
    service_data:
      name: Light Turn-On Data
      description: Bounded light.turn_on data with explicit brightness required.
      required: true
      selector:
        object: {}

release_control:
  name: Release Control Lease
  description: >
    Release only the exact matching lease. Never clears manual/admin external
    overrides and never resumes from an acquisition snapshot.
  target:
    entity:
      integration: presence_based_lighting
      domain: switch
  fields:
    controlled_entity_id:
      name: Controlled Entity
      required: false
      selector:
        entity: {}
    lease_id:
      name: Lease ID
      required: true
      selector:
        text: {}
    controller_id:
      name: Controller ID
      required: true
      selector:
        text: {}
    expected_generation:
      name: Expected Generation
      description: Compare-and-set generation returned by the latest acquire/update.
      required: true
      selector:
        number:
          min: 1
          mode: box
    request_id:
      name: Request ID
      required: true
      selector:
        text: {}
    owner:
      name: Owner
      required: true
      selector:
        select:
          options:
            - wake_light
    outcome:
      name: Outcome
      required: true
      selector:
        select:
          options:
            - completed
            - cancelled
            - failed
    cause:
      name: Cause
      description: Stable non-personal reason code.
      required: true
      selector:
        select:
          options:
            - hold_complete
            - occurrence_cancelled
            - external_targets_off
            - owner_failed
            - owner_shutdown
